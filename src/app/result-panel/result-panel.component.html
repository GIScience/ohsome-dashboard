<div class="result-panel-container">
  <h3 class="ui center aligned header" i18n>
    <i class="angle double down icon"></i>
    Result Log
    <i class="angle double down icon"></i>
  </h3>
  @if (resultList().length < 1) {
    <div class="ui blue icon message" i18n><i class="info circle icon"></i>Results will be shown here!</div>
  }
  <ng-template appResultList></ng-template>
</div>
